name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  HUSKY: "0"
  NEXT_PUBLIC_APP_URL: "https://app.ci.notted.invalid"
  NEXT_PUBLIC_API_URL: "https://api.ci.notted.invalid"
  NEXT_PUBLIC_WS_URL: "wss://api.ci.notted.invalid"

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    # The API's integration suites are gated on DATABASE_URL and skip without
    # one. Skipped, they leave `apps/api` far below its coverage thresholds and
    # `pnpm test:ci` cannot pass. The suites run their own migrations and seed,
    # so an empty database is all they need. The image must be pgvector rather
    # than stock postgres: migration 0000 enables the `vector` extension.
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
        env:
          # Throwaway credentials for an ephemeral, runner-local database. It is
          # never reachable off the runner and holds only generated fixtures.
          POSTGRES_USER: notted_ci
          POSTGRES_PASSWORD: notted_ci
          POSTGRES_DB: notted_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U notted_ci -d notted_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.1

      - name: Activate pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.34.5 --activate
          pnpm config set store-dir "${RUNNER_TEMP}/pnpm-store"
          pnpm --version

      - name: Restore pnpm package store
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pnpm-store
          key: pnpm-${{ runner.os }}-node-22.23.1-pnpm-10.34.5-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --strict-peer-dependencies

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Type-check
        run: pnpm type-check

      - name: Run unit tests with coverage
        # Scoped to this step only: `pnpm build` and `pnpm db:check` must keep
        # running against their own configuration, not the CI service database.
        env:
          DATABASE_URL: postgres://notted_ci:notted_ci@127.0.0.1:5432/notted_ci
        run: pnpm test:ci

      - name: Build production artifacts
        run: pnpm build

      - name: Check migration consistency
        run: pnpm db:check

      - name: Upload JUnit results
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-results
          path: "**/test-results/**/*.xml"
          if-no-files-found: warn
          retention-days: 7

      - name: Upload V8 coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: v8-coverage
          path: "**/coverage/**"
          if-no-files-found: warn
          retention-days: 7
