# Notted development infrastructure only. Applications run on the host.
# Use the root `pnpm infra:*` commands so the checkout-derived project name,
# canonical env file, bounded readiness wait, and reset protections are applied.

services:
  postgres:
    image: pgvector/pgvector:0.8.5-pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks: [infrastructure, loopback]

  redis:
    image: redis:7.2.14-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [infrastructure, loopback]

  meilisearch:
    image: getmeili/meilisearch:v1.45.1@sha256:ac40212f9e5a7526d8007586e3e46fb0441d29dd36c7b02fa2341d2c9a1f6493
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?MEILI_MASTER_KEY is required}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    ports:
      - "127.0.0.1:${MEILISEARCH_PORT:-7700}:7700"
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    networks: [infrastructure, loopback]

  minio-permissions:
    build:
      context: ./minio-source
      target: minio-server
      args:
        MINIO_SERVER_COMMIT: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
    user: "0:0"
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command: ["chown -R 10001:10001 /data"]
    volumes:
      - minio-data:/data
    restart: "no"
    networks: [infrastructure]

  minio:
    build:
      context: ./minio-source
      target: minio-server
      args:
        MINIO_SERVER_COMMIT: 7aac2a2c5b7c882e68c1ce017d8256be2feea27f
    depends_on:
      minio-permissions:
        condition: service_completed_successfully
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BROWSER_REDIRECT_URL: http://localhost:${MINIO_CONSOLE_PORT:-9001}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s
    networks: [infrastructure, loopback]

  minio-init:
    build:
      context: ./minio-source
      target: minio-client
      args:
        MINIO_CLIENT_COMMIT: 77f82e18b5401a65958f1619df6ebb994634bd88
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        attempt=1
        while [ "$${attempt}" -le 30 ]; do
          if mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}" \
            && mc mb "local/$${MINIO_BUCKET_ATTACHMENTS}" --ignore-existing \
            && mc mb "local/$${MINIO_BUCKET_EXPORTS}" --ignore-existing \
            && mc anonymous set none "local/$${MINIO_BUCKET_ATTACHMENTS}" \
            && mc anonymous set none "local/$${MINIO_BUCKET_EXPORTS}" \
            && mc anonymous get "local/$${MINIO_BUCKET_ATTACHMENTS}" | grep -F private \
            && mc anonymous get "local/$${MINIO_BUCKET_EXPORTS}" | grep -F private; then
            exit 0
          fi
          attempt=$$((attempt + 1))
          sleep 1
        done
        echo "MinIO bucket initialization did not become ready" >&2
        exit 1
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-notted-attachments}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-notted-exports}
    restart: "no"
    networks: [infrastructure]

  mailpit:
    image: axllent/mailpit:v1.30.0@sha256:0059ef81e492a7192af3816281eed6859eb078bd7bdc58b76757c13e10e53a7d
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    networks: [infrastructure, loopback]

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  minio-data:

networks:
  infrastructure:
    driver: bridge
    internal: true
  loopback:
    driver: bridge
