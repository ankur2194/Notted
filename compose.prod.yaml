# Notted production stack. Standalone file — it does not extend `compose.yaml`.
#
#   docker compose --env-file .env.production -f compose.prod.yaml up -d
#
# Reads `.env.production` (copy `.env.production.example`). See DEPLOYMENT.md.
#
# The `gateway` service routes one public origin to the web and API containers.
# The host's TLS terminator forwards https://$APP_DOMAIN to the single published
# loopback port 127.0.0.1:${NOTTED_PORT:-3200}.
# PostgreSQL, Redis, Meilisearch and MinIO publish nothing and are reachable
# only on the internal `backend` network.
#
# Start order (health-gated): postgres -> migrate -> api, with redis,
# meilisearch and minio-init also required before api. `migrate` is a one-shot
# `drizzle-kit migrate`; Compose re-runs it on every `up`, and Drizzle skips
# already-applied files, so it is safe to repeat.

name: notted

x-log-rotation: &log-rotation
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-api-environment: &api-environment
  NODE_ENV: production
  LOG_LEVEL: ${LOG_LEVEL:-info}
  API_HOST: 0.0.0.0
  API_PORT: "3001"
  # The TLS terminator and the Compose gateway are two proxy hops. Raise this
  # if a CDN/load balancer adds another trusted hop in front of them.
  TRUST_PROXY_HOPS: "${TRUST_PROXY_HOPS:-2}"
  APP_URL: https://${APP_DOMAIN:?set APP_DOMAIN in .env.production}
  API_URL: https://${APP_DOMAIN}
  WS_URL: wss://${APP_DOMAIN}
  BETTER_AUTH_URL: https://${APP_DOMAIN}
  BETTER_AUTH_TRUSTED_ORIGINS: https://${APP_DOMAIN}
  AUTH_PASSKEY_RP_ID: ${AUTH_PASSKEY_RP_ID:-${APP_DOMAIN}}
  DATABASE_URL: postgres://${POSTGRES_USER:-notted}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-notted}
  REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
  MINIO_ENDPOINT: minio
  MINIO_PORT: "9000"
  MINIO_USE_SSL: "false"
  MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-notted}
  MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
  MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-notted-attachments}
  MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-notted-exports}
  MEILISEARCH_HOST: http://meilisearch:7700
  MEILISEARCH_API_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
  MEILISEARCH_INDEX_PREFIX: ${MEILISEARCH_INDEX_PREFIX:-notted_}
  EXPORT_CHROMIUM_PATH: /usr/bin/chromium
  WEBHOOK_ALLOW_INSECURE_URLS: "false"

services:
  # ---------------------------------------------------------- infrastructure
  postgres:
    build:
      context: ./docker/patched-images
      target: postgres
    image: notted-postgres:local
    restart: unless-stopped
    logging: *log-rotation
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-notted}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-notted}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init-postgres.sql:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${POSTGRES_MEMORY_LIMIT:-1G}
    networks: [backend]

  redis:
    image: redis:7.2.14-alpine@sha256:dfa18828cbc07b3ae6a95ec7343f6c214fdee2d836197b4be8e9904420762cd8
    restart: unless-stopped
    logging: *log-rotation
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - "${REDIS_PASSWORD}"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-256mb}
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", 'REDISCLI_AUTH="$$REDIS_PASSWORD" redis-cli ping | grep -q PONG']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    deploy:
      resources:
        limits:
          memory: 384M
    networks: [backend]

  meilisearch:
    build:
      context: ./docker/patched-images
      target: meilisearch
    image: notted-meilisearch:local
    restart: unless-stopped
    logging: *log-rotation
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meilisearch-data:/meili_data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: ${MEILISEARCH_MEMORY_LIMIT:-1G}
    networks: [backend]

  minio:
    build:
      context: ./docker/minio-source
      target: minio-server
    image: notted-minio-server:local
    restart: unless-stopped
    logging: *log-rotation
    # No `--console-address`: the admin console is not served in production.
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notted}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BROWSER: "off"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512M
    networks: [backend]

  # Creates the two private buckets. Private per ADR 0005 — never public.
  minio-init:
    build:
      context: ./docker/minio-source
      target: minio-client
    image: notted-minio-client:local
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-eu", "-c"]
    command:
      - |
        mc alias set local http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_ROOT_PASSWORD}"
        mc mb "local/$${MINIO_BUCKET_ATTACHMENTS}" --ignore-existing
        mc mb "local/$${MINIO_BUCKET_EXPORTS}" --ignore-existing
        mc anonymous set none "local/$${MINIO_BUCKET_ATTACHMENTS}"
        mc anonymous set none "local/$${MINIO_BUCKET_EXPORTS}"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-notted}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET_ATTACHMENTS: ${MINIO_BUCKET_ATTACHMENTS:-notted-attachments}
      MINIO_BUCKET_EXPORTS: ${MINIO_BUCKET_EXPORTS:-notted-exports}
    restart: "no"
    networks: [backend]

  # ------------------------------------------------------------ application
  migrate:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: migrate
    image: notted-api-migrate:${NOTTED_IMAGE_TAG:-local}
    depends_on:
      postgres:
        condition: service_healthy
    # Full API environment (not only DATABASE_URL) so the same image also runs
    # the operator scripts that need it, e.g.
    #   docker compose ... run --rm migrate node --import tsx scripts/search-reindex.ts
    env_file: .env.production
    environment: *api-environment
    restart: "no"
    logging: *log-rotation
    networks: [backend]

  gateway:
    build:
      context: .
      dockerfile: docker/Dockerfile.gateway
    image: notted-gateway:${NOTTED_IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *log-rotation
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
      # Existing deployments can leave their old API_DOMAIN set during cutover.
      LEGACY_API_DOMAIN: ${API_DOMAIN:-legacy.invalid}
    ports:
      - "${NOTTED_BIND:-127.0.0.1}:${NOTTED_PORT:-3200}:8080"
    volumes:
      - ./docker/Caddyfile.prod:/etc/caddy/Caddyfile:ro
    read_only: true
    tmpfs:
      - /config:uid=1000,gid=1000,mode=0700
      - /data:uid=1000,gid=1000,mode=0700
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health/live"]
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: ${GATEWAY_MEMORY_LIMIT:-128M}
    networks: [edge]

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    image: notted-api:${NOTTED_IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *log-rotation
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    # Everything not computed above (SMTP, secrets, embeddings, feature flags,
    # rate limits, custom domains …) comes straight from `.env.production`.
    env_file: .env.production
    environment: *api-environment
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          'fetch("http://127.0.0.1:"+(process.env.API_PORT||3001)+"/health/ready").then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))',
        ]
      interval: 15s
      timeout: 15s
      start_period: 60s
      retries: 5
    read_only: true
    tmpfs:
      - /tmp
      # Chromium (PDF export) writes its profile and crash handler under
      # $HOME; the tmpfs must belong to the `node` user or the launch fails.
      - /home/node:uid=1000,gid=1000,mode=0700
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${API_MEMORY_LIMIT:-2G}
    networks:
      edge:
      backend:
        aliases:
          - ${APP_DOMAIN}

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
        NEXT_PUBLIC_WS_URL: wss://${APP_DOMAIN}
    image: notted-web:${NOTTED_IMAGE_TAG:-local}
    restart: unless-stopped
    logging: *log-rotation
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_APP_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_API_URL: https://${APP_DOMAIN}
      NEXT_PUBLIC_WS_URL: wss://${APP_DOMAIN}
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: ${WEB_MEMORY_LIMIT:-1G}
    networks: [edge]

volumes:
  postgres-data:
  redis-data:
  meilisearch-data:
  minio-data:

networks:
  backend:
    driver: bridge
    internal: true
  edge:
    driver: bridge
