# Container advisories accepted on the same terms as `pnpm.auditConfig.ignoreGhsas`
# in `package.json`: every id below has an `### E<n>` section in
# `docs/security/remediation-checklist.md` whose Deadline names a numbered Plan
# part, and `scripts/security-scan.test.mjs` fails if one does not.
#
# `expired_at` is what makes the suppression a dated promise rather than a
# permanent hole: past that date Trivy reports the advisory again and
# `pnpm security:containers` starts failing, with no second action required from
# anyone.
#
# Each `paths` entry pins the exact file the advisory was accepted for, pnpm
# version included. Bumping pnpm moves that path, the ignore stops matching, and
# the finding comes back — which is correct, because the bump is the fix.
vulnerabilities:
  - id: CVE-2026-14257
    paths:
      - "home/node/.cache/node/corepack/v1/pnpm/10.34.5/dist/node_modules/brace-expansion/package.json"
    statement: "E8: brace-expansion 2.1.2, bundled inside pnpm 10.34.5's own Corepack payload. Fixed only in pnpm 11, which requires Node >= 22.13 and an ADR 0008 baseline revalidation."
    expired_at: 2026-11-30
